<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樟山國小四年甲班班級點數</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#334155;background:linear-gradient(135deg,#fffbeb,#ecfdf5,#eff6ff)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:20px}.head,.card{background:#fffffff0;border-radius:28px;box-shadow:0 8px 28px #00000012}.head{padding:20px;margin-bottom:20px;display:flex;gap:14px;align-items:center}.logo{background:#10b981;color:white;padding:15px;border-radius:22px;font-size:28px}.head h1{margin:0;color:#047857}.head p{margin:5px 0 0;color:#64748b}.hero{text-align:center;color:white;background:linear-gradient(90deg,#10b981,#0ea5e9);padding:18px;border-radius:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.petcard{border:2px solid #d1fae5;background:linear-gradient(#fff,#ecfdf5);padding:16px;border-radius:25px;text-align:center}.who{display:flex;justify-content:space-between;text-align:left;font-weight:800}.pts{color:#d97706}.pet{font-size:74px;padding:12px}.stage{font-size:13px;color:#047857}.btn{border:0;border-radius:15px;padding:12px 16px;font-weight:800}.green{background:#10b981;color:white}.blue{background:#4f46e5;color:white}.orange{background:#f97316;color:white}.ghost{background:white;border:2px solid #cbd5e1}.full{width:100%}.login{padding:20px;text-align:center;border:2px solid #c7d2fe}.login input{width:100%;padding:12px;border:2px solid #c7d2fe;border-radius:12px;margin:12px 0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.row{display:grid;grid-template-columns:310px 1fr;gap:18px}.names{padding:15px}.names button{display:block;width:100%;margin:6px 0}.reason-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.reason{padding:16px;border-radius:16px;border:2px solid #ddd;font-weight:800}.reason:nth-child(10n+1){background:#fffbeb}.reason:nth-child(10n+2){background:#f0f9ff}.reason:nth-child(10n+3){background:#f5f3ff}.reason:nth-child(10n+4){background:#fdf2f8}.reason:nth-child(10n+5){background:#ecfdf5}.reason:nth-child(10n+6){background:#ecfeff}.reason:nth-child(10n+7){background:#eef2ff}.reason:nth-child(10n+8){background:#fff1f2}.reason:nth-child(10n+9){background:#f7fee7}.reason:nth-child(10n+10){background:#fff7ed}.panelcard{padding:25px}.wheelwrap{position:relative;width:min(450px,85vw);aspect-ratio:1;margin:20px auto}.pointer{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:-30px;font-size:48px}.wheel{width:100%;height:100%;border-radius:50%;border:10px solid white;box-shadow:0 10px 25px #0003;transition:transform 1.5s ease-out;position:relative}.wn{position:absolute;left:50%;top:50%;width:65px;color:white;text-align:center;font-weight:900;font-size:22px;text-shadow:0 2px 3px #0006}.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}.numbers button{padding:9px 2px;border:1px solid #fdba74;background:white;border-radius:8px;font-weight:800}.numbers .sel{background:#f97316;color:#fff}.rank{margin-top:18px;padding:15px}.pill{display:inline-block;margin:4px;padding:8px 12px;background:white;border-radius:999px}.center{text-align:center}@media(max-width:800px){.row{grid-template-columns:1fr}.reason-grid{grid-template-columns:1fr}.numbers{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="wrap"><div class="head"><div class="logo">🐾</div><div><h1>🌈 樟山國小四年甲班班級點數</h1><p>照顧可愛寵物、累積好表現，一起快樂成長！ ✨</p></div></div><main id="app"></main></div><script>
const INITIAL=[['伊斯林段‧嗨舒','大耳狗'],['劉澤躍','恐龍'],['呂家祿','鸚鵡'],['彼撒魯‧搭給嚕嘟恩','倉鼠'],['謝雁宇','黃金獵犬'],['池妤恩','老虎'],['高芷芸','綠鬣蜥']].map((x,i)=>({no:i+1,name:x[0],pet:x[1],points:0,feedDate:'',feeds:0,attendance:{}}));
const PET={'大耳狗':['🐶','🐶','🐕','🐕','🐕','🐕','🐕'],'恐龍':['🥚','🐣','🦕','🦖','🦖','🦖','🦖'],'鸚鵡':['🥚','🐣','🐤','🦜','🦜','🦜','🦜'],'倉鼠':['🐹','🐹','🐹','🐹','🐹','🐹','🐹'],'黃金獵犬':['🐶','🐶','🐕','🐕','🐕','🐕','🐕'],'老虎':['🐯','🐯','🐯','🐯','🐯','🐯','🐯'],'綠鬣蜥':['🥚','🐣','🦎','🦎','🦎','🦎','🦎']};
const R=[['📚','作業優良',1],['🙋','積極發言',1],['🤝','團隊合作',1],['📖','喜閱網闖關',1],['🧑‍🏫','秩序守規',1],['🧹','打掃整潔',1],['✏️','課堂測驗',1],['💗','熱心助人',2],['🌳','戶外教育',5],['🌟','自主管理',2]],W=[.5,1,1.5,2,1,-.5,-1,-1.5,-2,-1],C=['#fb7185','#f59e0b','#facc15','#84cc16','#10b981','#06b6d4','#3b82f6','#8b5cf6','#d946ef','#f43f5e'];
let S=(()=>{try{let x=JSON.parse(localStorage.getItem('zspoints'));return Array.isArray(x)&&x.length===7?x:INITIAL}catch{return INITIAL}})(),L=(()=>{try{return JSON.parse(localStorage.getItem('zslog'))||[]}catch{return[]}})(),mode='home',many=[0],owner=0,bet=5,rot=0,timerId=null;
const day=()=>new Date().toLocaleDateString('sv-SE'),stage=p=>Math.min(7,Math.floor(Math.max(0,p)/25)+1),ico=x=>PET[x.pet][stage(x.points)-1];
function save(){localStorage.setItem('zspoints',JSON.stringify(S));localStorage.setItem('zslog',JSON.stringify(L))}function snd(p){try{let A=new(window.AudioContext||window.webkitAudioContext),o=A.createOscillator(),g=A.createGain();o.type=(p==='恐龍'||p==='老虎')?'sawtooth':'sine';o.frequency.value=p==='恐龍'?85:p==='老虎'?110:p==='鸚鵡'?950:p==='倉鼠'?700:p==='黃金獵犬'?390:p==='綠鬣蜥'?260:520;o.connect(g);g.connect(A.destination);g.gain.value=.18;o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.5);o.stop(A.currentTime+.5)}catch{}}
function feed(i){let x=S[i],d=day(),n=x.feedDate===d?x.feeds:0;if(n>=3)return alert('今天已經餵食 3 次囉！明天再來。');x.points++;x.feedDate=d;x.feeds=n+1;L.unshift({name:x.name,reason:'餵食寵物',n:1});L=L.slice(0,100);save();render()}
function change(n,r){if(!many.length)return alert('請至少選一位學生喔！');many.forEach(i=>{S[i].points=Math.max(0,S[i].points+n);L.unshift({name:S[i].name,reason:r,n})});L=L.slice(0,100);save();teacherTab(1)}
function login(){if(document.querySelector('#pw').value==='4136'){mode='teacher';render()}else alert('密碼不正確')}
function render(){let a=document.querySelector('#app');if(mode==='home'){a.innerHTML=`<div class="hero"><h2>🐾 學生寵物樂園</h2><div>不用先點名字，直接找到自己的卡片餵食！</div></div><div class="grid">${S.map((x,i)=>{let f=x.feedDate===day()?x.feeds:0;return `<div class="petcard"><div class="who"><span>${x.no}號 ${x.name}</span><span class="pts">⭐${x.points}</span></div><button class="btn full" style="background:transparent" onclick="snd('${x.pet}')"><div class="pet">${ico(x)}</div><b>${x.pet} 🔊</b><div class="stage">成長階段 ${stage(x.points)} / 7</div></button><button class="btn green full" onclick="feed(${i})" ${f>=3?'disabled':''}>🥣 ${f>=3?'今天已餵飽囉！':'餵我的寵物 +1'}</button><b class="stage">今天已餵食 ${f} / 3 次</b></div>`}).join('')}<div class="card login"><h2>🔐 老師模式</h2><input id="pw" type="password" inputmode="numeric" placeholder="老師密碼"><button class="btn blue full" onclick="login()">進入老師模式</button></div></div>`;return}a.innerHTML=`<div class="tabs"><button class="btn ghost" onclick="mode='home';render()">← 回學生首頁</button>${['🐾 寵物','⭐ 給分','🎱 抽籤','⏰ 計時','✅ 點名','🎡 轉盤'].map((t,i)=>`<button class="btn ghost" onclick="teacherTab(${i})">${t}</button>`).join('')}</div><div id="panel"></div><div class="card rank">🏆 ${[...S].sort((a,b)=>b.points-a.points).map((x,i)=>`<span class="pill">${i+1}. ${x.name} ⭐${x.points}</span>`).join('')}</div>`;teacherTab(0)}
function teacherTab(k){let p=document.querySelector('#panel');if(!p)return;if(k===0)p.innerHTML=`<div class="grid">${S.map((x,i)=>`<div class="petcard"><b>${x.no}號 ${x.name} ⭐${x.points}</b><div class="pet">${ico(x)}</div><button class="btn green full" onclick="feed(${i})">餵飼料 +1</button></div>`).join('')}</div>`;
if(k===1)p.innerHTML=`<div class="row"><div class="card names"><h3>選擇學生（可複選）</h3><button class="btn ghost" onclick="many=[0,1,2,3,4,5,6];teacherTab(1)">全選</button> <button class="btn ghost" onclick="many=[];teacherTab(1)">清除</button>${S.map((x,i)=>`<button class="btn ${many.includes(i)?'green':'ghost'}" onclick="many.includes(${i})?many=many.filter(v=>v!==${i}):many.push(${i});teacherTab(1)">${x.no}號 ${x.name}</button>`).join('')}</div><div class="card panelcard"><h2>✨ 加分</h2><div class="reason-grid">${R.map(q=>`<button class="reason" onclick="change(${q[2]},'${q[1]}')">${q[0]} ${q[1]} +${q[2]}</button>`).join('')}</div><h2>⚠️ 扣分</h2>${[1,2,5].map(n=>`<button class="btn ghost" onclick="change(-${n},'表現扣分')">扣 ${n} 點</button>`).join(' ')}<h3>最近紀錄</h3>${L.slice(0,8).map(x=>`<div>${x.name}　${x.reason}　${x.n>0?'+':''}${x.n}</div>`).join('')}</div></div>`;
if(k===2)p.innerHTML=`<div class="card panelcard center"><h2>🎱 超級幸運樂透</h2><div id="balls" class="pet">🎱 🎱 🎱</div><button class="btn blue" onclick="draw()">開始抽幸運星！</button><div id="winner"></div></div>`;
if(k===3)p.innerHTML=`<div class="card panelcard center"><h2>⏰ 專注計時</h2><div id="clock" style="font-size:70px;font-weight:900">05:00</div>${[300,600,1200].map(n=>`<button class="btn ghost" onclick="startTimer(${n})">${n/60}分鐘</button>`).join(' ')}</div>`;
if(k===4)p.innerHTML=`<div class="card panelcard"><h2>✅ 每日點名 ${day()}</h2>${S.map((x,i)=>`<button class="btn ${x.attendance?.[day()]?'green':'ghost'} full" style="margin:5px 0" onclick="S[${i}].attendance['${day()}']=!S[${i}].attendance['${day()}'];save();teacherTab(4)">${x.no}號 ${x.name}　${x.attendance?.[day()]?'✓ 已到':'○ 未點名'}</button>`).join('')}</div>`;
if(k===5){let grad=W.map((_,i)=>`${C[i]} ${i*36}deg ${(i+1)*36}deg`).join(',');p.innerHTML=`<div class="row"><div class="card names"><h3>選擇主人</h3>${S.map((x,i)=>`<button class="btn ${owner===i?'orange':'ghost'}" onclick="owner=${i};teacherTab(5)">${x.no}號 ${x.name} ⭐${x.points}</button>`).join('')}</div><div class="card panelcard center"><h2>🎡 命運大轉盤</h2><div class="wheelwrap"><div class="pointer">🔻</div><div id="wheel" class="wheel" style="transform:rotate(${rot}deg);background:conic-gradient(${grad})">${W.map((x,i)=>{let a=(i+.5)*36;return `<div class="wn" style="transform:translate(-50%,-50%) rotate(${a}deg) translateY(-170px) rotate(${-a}deg)">${x>0?'+':''}${x}</div>`}).join('')}</div></div><b>投注：${bet} 點</b><div class="numbers">${Array.from({length:50},(_,i)=>i+1).map(n=>`<button class="${bet===n?'sel':''}" onclick="bet=${n};teacherTab(5)">${n}</button>`).join('')}</div><button class="btn orange" onclick="spin()">轉動！</button><div id="spinres"></div></div></div>`}}
function draw(){let b=document.querySelector('#balls'),w=document.querySelector('#winner'),t=0,id=setInterval(()=>{let x=S[Math.floor(Math.random()*S.length)];b.textContent=ico(x);if(++t>14){clearInterval(id);w.innerHTML=`<h2>🎉 ${x.no}號 ${x.name}</h2>`}},80)}
function startTimer(s){clearInterval(timerId);let el=document.querySelector('#clock');function show(){el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}show();timerId=setInterval(()=>{s--;show();if(s<=0){clearInterval(timerId);snd('鸚鵡')}},1000)}
function spin(){let x=S[owner],b=bet;if(x.points<20)return alert('需要至少 20 點才能參加命運轉盤。');if(x.points<b)return alert('點數不足。');let ri=Math.floor(Math.random()*W.length),r=W[ri],target=360-(ri+.5)*36,current=((rot%360)+360)%360,targetN=((target%360)+360)%360,extra=(targetN-current+360)%360,d=Math.round(b*r);x.points-=b;save();rot+=1440+extra;document.querySelector('#wheel').style.transform=`rotate(${rot}deg)`;setTimeout(()=>{x.points=Math.max(0,x.points+d);L.unshift({name:x.name,reason:'命運轉盤結果',n:d});save();document.querySelector('#spinres').innerHTML=`<h2>結果 ${r>0?'+':''}${r}倍，${d>=0?'增加':'扣除'} ${Math.abs(d)} 點</h2>`},1500)}render();
</script></body></html>
